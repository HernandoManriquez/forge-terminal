name: Build and test Forge
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/quality_gate.py
      - run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: forge-linux-x64
          path: build/forge-linux-x64
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - shell: pwsh
        run: |
          $env:Path = "C:\msys64\mingw64\bin;" + $env:Path
          $env:CGO_ENABLED = '1'
          npm.cmd ci
          go test -race ./src/internal/...
          if ($LASTEXITCODE -ne 0) { throw 'Go tests failed' }
          node --test tests/model.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Model tests failed' }
          & .\scripts\build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: forge-windows-x64
          path: build/forge.exe
